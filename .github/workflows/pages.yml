name: Publish test site

# 公開はユーザーがGitHubのActions画面から明示的に実行する。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # このリポジトリのクラウド専用キャッシュ先を上書きする。
      - run: npm ci --cache "$RUNNER_TEMP/npm-cache"
      - run: npm run lint
      - run: npm run test
      # typecheckはbuildに含まれる。Viteの相対baseはPagesのサブパスにも対応。
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
